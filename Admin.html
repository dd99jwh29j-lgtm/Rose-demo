
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROSE Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100b20;color:white;font-family:Arial;padding:15px}
h1{color:#ff55b5;text-align:center}
.box{background:#251938;padding:16px;border-radius:14px;margin:14px auto;max-width:700px}
input,button{width:100%;padding:13px;margin:7px 0;border:0;border-radius:8px;font-size:15px}
button{background:#e83b9e;color:white;font-weight:bold}
.user{background:#39264c;padding:13px;border-radius:9px;margin:10px 0;overflow-wrap:anywhere}
.small{color:#ccc;font-size:13px;overflow-wrap:anywhere}
.hidden{display:none}
</style>
</head>
<body>
<h1>🌹 ROSE ADMIN</h1>
<div class="box" id="loginBox">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Admin Password">
<button onclick="login()">LOGIN</button>
<p id="msg" class="small"></p>
</div>

<div id="panel" class="hidden">
<div class="box">
<h2>Admin Dashboard</h2>
<button onclick="loadUsers()">Refresh Users</button>
<button onclick="loadHistory()">Refresh History</button>
<button onclick="logout()">Logout</button>
<p id="status" class="small"></p>
</div>

<div class="box">
<h2>User Management</h2>
<div id="users">Loading...</div>
</div>

<div class="box">
<h2>Update Virtual Points</h2>
<input id="userId" placeholder="Selected User ID">
<input id="amount" type="number" placeholder="Points (+ add / - subtract)">
<input id="reason" placeholder="Reason">
<button onclick="adjustPoints()">UPDATE POINTS</button>
<p id="adjustMsg" class="small"></p>
</div>

<div class="box">
<h2>All Users Points History</h2>
<div id="history">Loading history...</div>
</div>
</div>

<script>
const db=window.supabase.createClient(
"https://umyptqmgnwryfhhyhnvw.supabase.co",
"sb_publishable_vDxD-efuruGj8oGVCGUsPQ_R0DGEqju"
);

async function login(){
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
const msg=document.getElementById("msg");
if(!email||!password){msg.innerText="Email aur password bharein.";return;}
msg.innerText="Checking login...";
const {error}=await db.auth.signInWithPassword({email,password});
if(error){msg.innerText=error.message;return;}
await checkAdmin();
}

async function checkAdmin(){
const {data:{user}}=await db.auth.getUser();
if(!user)return;
const {data,error}=await db.from("profiles").select("role").eq("id",user.id).single();
if(error||!data||data.role!=="admin"){
document.getElementById("msg").innerText="Admin access denied.";
await db.auth.signOut();return;
}
document.getElementById("loginBox").classList.add("hidden");
document.getElementById("panel").classList.remove("hidden");
await loadUsers();
await loadHistory();
}

async function loadUsers(){
const box=document.getElementById("users");
box.innerText="Loading users...";
const {data,error}=await db.from("profiles")
.select("id,username,points,role,is_blocked").order("username");
if(error){box.innerText="Error: "+error.message;return;}
box.innerHTML="";
data.forEach(u=>{
const div=document.createElement("div");div.className="user";
const name=document.createElement("b");
name.textContent=u.username||"User";
const info=document.createElement("p");
info.textContent="Points: "+u.points+" | Role: "+u.role;
const status=document.createElement("p");
status.textContent="Status: "+(u.is_blocked?"BLOCKED":"ACTIVE");
const id=document.createElement("p");id.className="small";
id.textContent="User ID: "+u.id;
const select=document.createElement("button");
select.textContent="Select User";
select.onclick=()=>document.getElementById("userId").value=u.id;
div.append(name,info,status,id,select);

if(u.role==="user"){
const block=document.createElement("button");
block.textContent=u.is_blocked?"UNBLOCK USER":"BLOCK USER";
block.style.background=u.is_blocked?"#238b57":"#c73535";
block.onclick=()=>toggleBlock(u.id,!u.is_blocked,block);
div.appendChild(block);
}
box.appendChild(div);
});
document.getElementById("status").innerText="Total users: "+data.length;
}

async function toggleBlock(id,blocked,button){
button.disabled=true;
button.textContent="Please wait...";
const {error}=await db.rpc("admin_set_user_blocked",{
target_user_id:id,blocked:blocked
});
if(error){
alert("Error: "+error.message);
button.disabled=false;
await loadUsers();
return;
}
alert(blocked?"User blocked successfully":"User unblocked successfully");
await loadUsers();
}

async function loadHistory(){
const box=document.getElementById("history");
box.innerText="Loading history...";
const {data:rows,error}=await db.from("points_history")
.select("*").order("created_at",{ascending:false}).limit(100);
if(error){box.innerText="History error: "+error.message;return;}
if(!rows||rows.length===0){box.innerText="No history found.";return;}
const {data:users}=await db.from("profiles").select("id,username");
const names={};
(users||[]).forEach(u=>names[u.id]=u.username||"User");
box.innerHTML="";
rows.forEach(r=>{
const div=document.createElement("div");div.className="user";
const uid=r.user_id||r.target_user_id||r.profile_id||"";
const title=document.createElement("b");
title.textContent=names[uid]||"User";
const details=document.createElement("p");
details.textContent="Points: "+(r.amount??r.points_change??r.change_amount??r.delta??r.points??"—");
const reason=document.createElement("p");
reason.textContent="Reason: "+(r.reason??r.description??"—");
const date=document.createElement("p");date.className="small";
date.textContent=r.created_at?new Date(r.created_at).toLocaleString():"Date unavailable";
div.append(title,details,reason,date);box.appendChild(div);
});
}

async function adjustPoints(){
const userId=document.getElementById("userId").value.trim();
const amount=Number(document.getElementById("amount").value);
const reason=document.getElementById("reason").value.trim();
const msg=document.getElementById("adjustMsg");
if(!userId||!Number.isSafeInteger(amount)||amount===0||!reason){
msg.innerText="User ID, points aur reason bharein.";return;
}
const {error}=await db.rpc("admin_adjust_points",{
target_user_id:userId,amount:amount,reason:reason
});
if(error){msg.innerText="Error: "+error.message;return;}
msg.innerText="Points updated successfully!";
document.getElementById("amount").value="";
document.getElementById("reason").value="";
await loadUsers();await loadHistory();
}

async function logout(){
await db.auth.signOut();location.reload();
}

db.auth.getSession().then(({data,error})=>{
if(!error&&data.session)checkAdmin();
});
</script>
</body>
</html>
