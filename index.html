
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROSE User Profile</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100b20;color:white;font-family:Arial;text-align:center}
header{background:#24133d;padding:22px;color:#ff5bbd;font-size:30px;font-weight:bold}
main{padding:18px}
.box{background:#241a38;padding:20px;border-radius:15px;margin:16px auto;max-width:600px}
h2{color:#ff8acb}
input,button{width:100%;padding:14px;margin:8px 0;border:0;border-radius:8px;font-size:16px}
button{background:#ed42a5;color:white;font-weight:bold}
.small{color:#bbb;font-size:13px}
.hidden{display:none}
.history{background:#39204e;padding:12px;border-radius:9px;margin:10px 0}
.points{font-size:36px;color:#ff83c7;font-weight:bold}
</style>
</head>
<body>
<header>🌹 ROSE</header>
<main>
<div class="box" id="auth">
<h2>Welcome to ROSE</h2>
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password">
<button onclick="signup()">Create Account</button>
<button onclick="login()">Login</button>
<p id="message" class="small"></p>
</div>

<div id="dashboard" class="hidden">
<div class="box">
<h2>My Profile</h2>
<p>Welcome, <b id="username">ROSE User</b></p>
<p>Your Virtual Points</p>
<div class="points" id="balance">0</div>
<p class="small">Virtual demo points only. No cash value.</p>
<button onclick="refreshProfile()">Refresh Profile</button>
<button onclick="logout()">Logout</button>
</div>

<div class="box">
<h2>Points History</h2>
<div id="history">Loading history...</div>
</div>

<div class="box">
<h2>Games</h2>
<p>✈️ Aviator — Coming Soon</p>
<p>🏏 Live Cricket — Coming Soon</p>
</div>
</div>
</main>

<script>
const db=window.supabase.createClient(
"https://umyptqmgnwryfhhyhnvw.supabase.co",
"sb_publishable_vDxD-efuruGj8oGVCGUsPQ_R0DGEqju"
);

function msg(t){document.getElementById("message").textContent=t;}

async function signup(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 if(!email || password.length<6){msg("Email aur 6 character ka password dalein.");return;}
 const {error}=await db.auth.signUp({email,password});
 msg(error?error.message:"Account created. Email verify karke login karein.");
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 if(!email||!password){msg("Email aur password bharein.");return;}
 const {error}=await db.auth.signInWithPassword({email,password});
 if(error){msg(error.message);return;}
 await showDashboard();
}

async function showDashboard(){
 const {data:{user}}=await db.auth.getUser();
 if(!user)return;
 document.getElementById("auth").classList.add("hidden");
 document.getElementById("dashboard").classList.remove("hidden");
 await refreshProfile();
}

async function refreshProfile(){
 const {data:{user}}=await db.auth.getUser();
 if(!user)return;
 const {data,error}=await db.from("profiles")
 .select("username,points").eq("id",user.id).single();
 if(error){msg(error.message);return;}
 document.getElementById("username").textContent=data.username||"ROSE User";
 document.getElementById("balance").textContent=data.points??0;
 await loadHistory(user.id);
}

async function loadHistory(userId){
 const box=document.getElementById("history");
 box.textContent="Loading...";
 const {data,error}=await db.from("points_history")
 .select("*").eq("user_id",userId)
 .order("created_at",{ascending:false}).limit(30);
 if(error){box.textContent="History unavailable: "+error.message;return;}
 if(!data||data.length===0){box.textContent="Abhi koi points history nahi hai.";return;}
 box.innerHTML="";
 data.forEach(row=>{
  const item=document.createElement("div");
  item.className="history";
  const amount=row.amount??row.points_change??row.change_amount??row.delta;
  const reason=row.reason??row.description??"Virtual points update";
  const date=row.created_at?new Date(row.created_at).toLocaleString():"";
  const title=document.createElement("b");
  title.textContent=amount===undefined?"Points update":(Number(amount)>0?"+":"")+amount+" points";
  const detail=document.createElement("p");
  detail.textContent=String(reason);
  const when=document.createElement("p");
  when.className="small";
  when.textContent=date;
  item.append(title,detail,when);
  box.appendChild(item);
 });
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

db.auth.getSession().then(({data})=>{
 if(data.session)showDashboard();
});
</script>
</body>
</html>
