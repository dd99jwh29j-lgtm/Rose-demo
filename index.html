
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHIVA EXCHANGE</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#101713;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 background:#17251c;
 padding:22px 12px;
 text-align:center;
 border-bottom:2px solid #20c66b;
}
h1{color:#20e77a;margin:0}
.subtitle{color:#aaa;margin-top:8px}
.container{padding:20px;max-width:600px;margin:auto}
.card{
 background:#1b2921;
 padding:20px;
 border-radius:12px;
 margin-bottom:15px;
 border:1px solid #34483a;
}
input{
 width:100%;
 padding:14px;
 margin:8px 0;
 border-radius:7px;
 border:1px solid #555;
 background:#101713;
 color:white;
}
button{
 width:100%;
 padding:14px;
 background:#18b85d;
 color:white;
 border:0;
 border-radius:7px;
 font-size:16px;
 font-weight:bold;
}
.games{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}
.game{
 background:#24372a;
 padding:25px 8px;
 text-align:center;
 border-radius:10px;
 border:1px solid #3b6046;
}
footer{text-align:center;color:#888;padding:20px}
</style>
</head>
<body>
<header>
<h1>SHIVA EXCHANGE</h1>
<div class="subtitle">YOUR DEMO GAMING PLATFORM</div>
</header>

<div class="container">
<div class="card">
<h2>User Login</h2>
<input id="username" placeholder="Enter Username">
<input id="password" type="password" placeholder="Enter Password">
<button onclick="login()">LOGIN</button>
<p id="message"></p>
</div>

<div class="card">
<h2>Demo Games</h2>
<div class="games">
<div class="game">✈️<br><br>Aviator Demo</div>
<div class="game">🏏<br><br>Cricket Demo</div>
<div class="game">🎮<br><br>Arcade Demo</div>
<div class="game">🎯<br><br>Other Games</div>
</div>
</div>
</div>

<footer>SHIVA EXCHANGE © 2026</footer>

<script>
function login(){
 const u=document.getElementById("username").value.trim();
 const p=document.getElementById("password").value;
 if(!u || !p){
 document.getElementById("message").textContent=
 "Please enter username and password";
 return;
 }
 document.getElementById("message").textContent=
 "Demo login screen ready. Secure account setup is pending.";
}
</script>
</body>
</html>
